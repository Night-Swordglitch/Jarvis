name: JARVIS security tests

on:
  push:
    branches: [local-import]
  pull_request:
    branches: [main]

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run pytest security regressions
        run: >-
          python -m pytest -q
          tests/test_agent_action_executor_security.py
          tests/test_execution_approval_security.py
      - name: Run Phase 8 execution contract
        run: python test_phase8_step5.py
      - name: Run Phase 8 human approval integration
        run: python test_phase8_step6.py

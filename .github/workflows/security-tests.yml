name: JARVIS security tests

on:
  push:
    branches: [local-import]
  pull_request:
    branches: [main]

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application and Brain runtime
        run: >-
          python -m py_compile main.py
          core/brain/*.py
          core/management/manager.py
          core/scheduler.py
      - name: Install test runner
        run: python -m pip install --upgrade pytest requests
      - name: Run focused security regression tests
        run: >-
          python -m pytest -q
          tests/test_agent_action_executor_security.py
          tests/test_execution_approval_security.py
          tests/test_brain_planning.py
          tests/test_management_task_dependencies.py
          tests/test_brain_management_bridge.py
          tests/test_brain_mission_runtime.py
          tests/test_management_state_store.py
      - name: Run Phase 7 mission-management regression tests
        shell: bash
        run: |
          for test_file in test_phase7_step{1..15}.py; do
            echo "===== $test_file ====="
            python "$test_file"
          done
      - name: Run Phase 8D to 8L contract tests
        shell: bash
        run: |
          for test_file in test_phase8_step{4..12}.py; do
            echo "===== $test_file ====="
            python "$test_file"
          done
